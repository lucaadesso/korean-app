<!-- Zen Word Result — HTMX partial shown after answer check -->
<div id="zen-word-puzzle"
     style="background:var(--bg-glass); border:1px solid var(--border); border-radius:24px; padding:1.8rem; text-align:center; animation: fadeSlideIn .35s ease;">

  <!-- Korean word (large) -->
  <div style="
    font-family:'Noto Sans KR',sans-serif;
    font-size:3.5rem; font-weight:700; letter-spacing:.08em;
    background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    margin-bottom:.4rem; line-height:1.1;
  ">{{ word.j }}</div>

  <!-- Romaja answer -->
  <div style="font-size:1.6rem; font-weight:700; color:var(--accent-3); margin-bottom:.3rem; letter-spacing:.06em;">
    {{ word.r }}
  </div>

  <!-- Meaning -->
  <div style="font-size:.88rem; color:var(--text-muted); margin-bottom:1.2rem;">
    🇮🇹 {{ word.m }}
  </div>

  <!-- Result badge -->
  {% if is_correct is none %}
    <!-- Hint mode: no judgement -->
    <div style="
      display:inline-flex; align-items:center; gap:.5rem;
      background:rgba(255,190,85,.12); border:1px solid rgba(255,190,85,.3);
      border-radius:100px; padding:.4rem 1.1rem;
      color:var(--accent-warn); font-weight:600; font-size:.88rem;
      margin-bottom:1.2rem;
    ">💡 Risposta mostrata — nessuna penalità</div>
  {% elif is_correct %}
    <div style="
      display:inline-flex; align-items:center; gap:.5rem;
      background:rgba(94,231,160,.12); border:1px solid rgba(94,231,160,.3);
      border-radius:100px; padding:.4rem 1.1rem;
      color:var(--accent-ok); font-weight:600; font-size:.88rem;
      margin-bottom:1.2rem;
    ">✅ Corretto! Ottimo!</div>
  {% else %}
    <div style="
      display:inline-flex; align-items:center; gap:.5rem;
      background:rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.3);
      border-radius:100px; padding:.4rem 1.1rem;
      color:var(--accent-bad); font-weight:600; font-size:.88rem;
      margin-bottom:1.2rem;
    ">❌ Hai scritto: <em>{{ user_answer }}</em></div>
  {% endif %}

  <!-- Action buttons -->
  <div style="display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap;">

    <!-- 🔊 TTS button (uses speakKorean from zen_mode.html) -->
    <button
      type="button"
      onclick="if(typeof speakKorean==='function') speakKorean('{{ word.j }}')"
      style="
        padding:.55rem 1rem; border-radius:var(--radius-md);
        background:rgba(0,170,255,.12); border:1px solid rgba(0,170,255,.3);
        color:var(--accent-1); font-size:.88rem; cursor:pointer;
        transition:background .2s; font-family:'Inter',sans-serif;
      "
      onmouseover="this.style.background='rgba(0,170,255,.2)'"
      onmouseout="this.style.background='rgba(0,170,255,.12)'"
      id="zen-speak-btn"
    >🔊 Ascolta</button>

    {% if has_next %}
    <!-- Next word button -->
    <button
      hx-get="/api/zen/word?exclude={{ exclude_id }}"
      hx-target="#zen-word-puzzle"
      hx-swap="outerHTML"
      style="
        padding:.55rem 1.2rem; border-radius:var(--radius-md);
        background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
        border:none; color:#fff; font-weight:700; font-size:.9rem;
        cursor:pointer; transition:transform .15s, box-shadow .15s;
        font-family:'Inter',sans-serif;
      "
      onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(0,170,255,.4)'"
      onmouseout="this.style.transform=''; this.style.boxShadow=''"
      id="zen-next-word-btn"
    >Prossima parola →</button>
    {% else %}
    <div style="font-size:.82rem; color:var(--text-muted); padding:.55rem 1rem;">
      🎉 Hai visto tutte le parole disponibili!
    </div>
    {% endif %}

  </div>

</div>
