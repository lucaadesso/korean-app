# ══════════════════════════════════════════════════════════════════
#  Nginx Reverse Proxy — Korean Learning App
#  Upstream:  127.0.0.1:8016 (Uvicorn)
#  Public:    https://korean.yourdomain.com
#
#  To use:
#    1. Copy this file to /etc/nginx/sites-available/korean-app
#    2. Replace "korean.yourdomain.com" with your actual domain
#    3. Obtain an SSL cert: sudo certbot --nginx -d korean.yourdomain.com
#    4. sudo ln -s /etc/nginx/sites-available/korean-app \
#                  /etc/nginx/sites-enabled/korean-app
#    5. sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name korean.yourdomain.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # All other HTTP traffic → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name korean.yourdomain.com;

    # ── SSL certificates (managed by Certbot) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/korean.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/korean.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # ── Logging ─────────────────────────────────────────────────────
    access_log /var/log/nginx/korean-app-access.log;
    error_log  /var/log/nginx/korean-app-error.log warn;

    # ── Static files (served directly by Nginx for performance) ─────
    location /static/ {
        alias /home/ubuntu/korean-app/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Proxy to FastAPI/Uvicorn ─────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8016;
        proxy_http_version 1.1;

        # Required for WebSockets (HTMX SSE, etc.)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass real client info
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;

        # Buffer settings
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 8k;
    }

    # ── Health check endpoint ────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8016/api/status;
        access_log off;
    }

    # ── Deny hidden files ────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
